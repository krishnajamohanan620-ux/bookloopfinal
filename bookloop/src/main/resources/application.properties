spring.application.name=bookloop

# Server Port
server.port=8080

# MySQL Database Configuration
# Using environment variables with fallback defaults to avoid hardcoding in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookloop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kichcoder12}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Thymeleaf caching disabled for development hot reload
spring.thymeleaf.cache=false
