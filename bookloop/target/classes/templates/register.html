<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookLoop — Campus Book Exchange | Create Account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-brand">
                    <span>📚</span>
                    <span>BookLoop</span>
                </div>
                <p class="auth-subtitle">Join your college book exchange community</p>
            </div>

            <!-- Tabs: Login / Create Account -->
            <div class="auth-tabs">
                <a th:href="@{/login}" class="auth-tab">Sign In</a>
                <a th:href="@{/register}" class="auth-tab active">Create Account</a>
            </div>

            <div class="auth-body">
                <!-- Registration Form -->
                <form th:action="@{/register}" th:object="${registerDto}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                               placeholder="e.g. Rahul Sharma" required autofocus>
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Campus / Student Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="e.g. rahul.s@campus.edu" required>
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="collegeName">College / University Name</label>
                        <input type="text" id="collegeName" th:field="*{collegeName}" class="form-control"
                               th:classappend="${#fields.hasErrors('collegeName')} ? 'is-invalid' : ''"
                               placeholder="e.g. Apex Institute of Technology" required>
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('collegeName')}" th:errors="*{collegeName}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password (at least 6 characters)</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                               placeholder="Create a strong password" required>
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                               placeholder="Re-type your password" required>
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                        Create Account & Enter BookLoop
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b;">
                    Already have an account?
                    <a th:href="@{/login}" style="font-weight: 600;">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
